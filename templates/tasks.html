<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Tasks</title>
    <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/tasks.css') }}" rel="stylesheet">
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
    <h4>C2 Panel</h4>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('agents_list') }}">Live Agents</a>
    <a href="{{ url_for('tasks_list') }}" class="disabled-link">All Tasks</a>
    <a href="{{ url_for('uploads_list') }}">Uploaded Files</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</div>

<!-- ================= MAIN ================= -->
<div class="main">
    <div class="card mb-4">
        <div class="card-body">
            <div class="section-title mb-3">All Tasks</div>

            <!-- ===== Filters ===== -->
            <div class="filters-wrapper">
                <input type="text" class="form-control filter-input" id="filterAgent" placeholder="Agent ID">
                <input type="text" class="form-control filter-input" id="filterUUID" placeholder="Task UUID">
                <select class="form-select filter-input" id="filterType">
                    <option value="">All Types</option>
                    <option value="shell">Shell</option>
                    <option value="download">Download</option>
                    <option value="upload">Upload</option>
                    <option value="sleep">Sleep</option>
                </select>
                <select class="form-select filter-input" id="filterStatus">
                    <option value="">All Status</option>
                    <option value="completed">Completed</option>
                    <option value="pending">Pending</option>
                    <option value="failed">Failed</option>
                </select>
            </div>

            <!-- ===== Tasks Table ===== -->
            <table class="table table-hover table-bordered" id="tasksTable">
                <thead class="table-dark">
                    <tr>
                        <th>Agent ID</th>
                        <th>Task Type</th>
                        <th>Command / URL / Path</th>
                        <th>Output</th>
                        <th>Executed At</th>
                        <th>UUID</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tasksBody">
                    <!-- Populated via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    window.API_KEY = "{{ api_key }}";
</script>
<script src="{{ url_for('static', filename='js/tasks.js') }}"></script>
</body>
</html>
