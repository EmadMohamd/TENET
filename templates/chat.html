<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link rel="icon" type="image/png" href="/static/images/icon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* ================= GLOBAL (Matches Dashboard) ================= */
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e5e7eb;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ================= TOP NAVBAR (Exact Dashboard Clone) ================= */
        .sidebar {
            height: 60px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background-color: #020617 !important;
            border-bottom: 1px solid #334155;
            padding: 0 20px;
            z-index: 1000;
        }

        .sidebar h4 {
            color: #cbd5f5;
            margin: 0 20px 0 0;
            /* Matches Bootstrap 5's default H4 scaling and weight */
            font-size: calc(1.275rem + .3vw);
            font-weight: 500;
            line-height: 1.2;
        }

        .sidebar a {
            padding: 0 15px;
            color: #cbd5f5 !important;
            text-decoration: none;
            font-size: 15px;
            line-height: 60px;
        }

        .sidebar a:hover {
            background-color: #1e293b !important;
        }

        /* ================= CHAT VIEWPORT ================= */
        #messages {
            flex: 1;
            overflow-y: auto;
            /* Padding-top: 80px ensures content clears the 60px navbar */
            padding: 80px 20% 20px 20%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        @media (max-width: 768px) {
            #messages { padding: 80px 5% 20px 5%; }
            .input-area { padding: 20px 5% 30px 5%; }
            .sidebar {
                flex-direction: column;
                height: auto;
                padding: 10px;
            }
            .sidebar a { line-height: normal; padding: 8px 0; }
        }

        /* ================= BUBBLES ================= */
        .msg {
            max-width: 75%;
            padding: 16px 20px;
            font-size: 16px;
            line-height: 1.6;
            word-wrap: break-word;
            border-radius: 12px;
        }

        .msg-user {
            align-self: flex-end;
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .msg-ai {
            align-self: flex-start;
            background: #1e293b;
            border: 1px solid #334155;
            border-bottom-left-radius: 4px;
        }

        /* Markdown structural rules inside AI containers to handle parsing gracefully */
        .msg-ai p { margin: 0 0 10px 0; }
        .msg-ai p:last-child { margin-bottom: 0; }
        .msg-ai ul, .msg-ai ol { margin: 6px 0; padding-left: 24px; }
        .msg-ai li { margin-bottom: 6px; }
        .msg-ai hr { border: 0; border-top: 1px solid #475569; margin: 12px 0; opacity: 1; }

        /* ================= INPUT AREA ================= */
        .input-area {
            padding: 20px 20% 40px 20%;
            background: linear-gradient(transparent, #0f172a 30%);
        }

        .suggestions-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .suggestion-btn {
            background: transparent;
            border: 1px solid #334155;
            color: #e5e7eb;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .suggestion-btn:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .input-wrapper {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            display: flex;
            padding: 12px 20px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .input-wrapper button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 15px;
        }

        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h4>TENET</h4>
        <a href="/dashboard">Dashboard</a>
        <a href="/info">Info</a>
        <a href="/alerts">Alerts & Logging</a>
        <a href="/agents">Live Agents</a>
        <a href="/tasks">Tasks</a>
        <a href="/uploads">Uploaded Files</a>
        <a href="/plugins">Plugins</a>
        <a href="/chat">AI Assistant</a>
        <a href="{{ url_for('auth.logout') }}">Logout</a>
    </div>

    <div id="messages"></div>

    <div class="input-area">
        <div id="suggestions" class="suggestions-row"></div>
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const messageContainer = document.getElementById("messages");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const suggestionBox = document.getElementById("suggestions");

        const CONFIG = {
            endpoint: "/ai/chat",
            suggestions: ["Which agents are offline?", "Show recent alerts", "Show Pending Tasks?"]
        };

        function escapeHTML(str) {
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[m]);
        }

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = `msg ${type === "user" ? "msg-user" : "msg-ai"}`;

            // Render HTML if it's an AI message, otherwise use text to maintain safety
            if (type === "user" || text === "...") {
                div.innerHTML = escapeHTML(text);
            } else {
                if (window.marked && typeof window.marked.parse === 'function') {
                    div.innerHTML = window.marked.parse(text);
                } else {
                    div.innerHTML = escapeHTML(text);
                }
            }

            messageContainer.appendChild(div);
            messageContainer.scrollTop = messageContainer.scrollHeight;

            // SYNC LOGIC:
            const history = JSON.parse(localStorage.getItem("tenet_chat_history") || "[]");
            history.push({ text, type });
            localStorage.setItem("tenet_chat_history", JSON.stringify(history));
        }

        function renderSuggestions() {
            CONFIG.suggestions.forEach(q => {
                const btn = document.createElement("button");
                btn.className = "suggestion-btn";
                btn.textContent = q;
                btn.onclick = () => send(q);
                suggestionBox.appendChild(btn);
            });
        }

        async function send(msg = null) {
            const text = msg || userInput.value.trim();
            if (!text) return;

            addMessage(text, "user");
            userInput.value = "";

            const loading = document.createElement("div");
            loading.className = "msg msg-ai";
            loading.textContent = "...";
            messageContainer.appendChild(loading);

            try {
                const res = await fetch(CONFIG.endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                loading.remove();
                addMessage(data.reply || "No response.", "ai");
            } catch (e) {
                loading.remove();
                addMessage("Server error.", "ai");
            }
        }

        sendBtn.onclick = () => send();
        userInput.onkeypress = (e) => { if (e.key === "Enter") send(); };

        window.onload = () => {
            // Only add the greeting if history is clean or empty
            const history = JSON.parse(localStorage.getItem("tenet_chat_history") || "[]");
            if (history.length === 0) {
                addMessage("How can I help you today?", "ai");
            } else {
                // Optional: Reload past chat history if needed, or leave it fresh
                history.forEach(item => {
                    // Temporarily bypass history duplicating onto itself during load
                    const oldHistory = localStorage.getItem("tenet_chat_history");

                    const div = document.createElement("div");
                    div.className = `msg ${item.type === "user" ? "msg-user" : "msg-ai"}`;
                    if (item.type === "user") {
                        div.innerHTML = escapeHTML(item.text);
                    } else {
                        div.innerHTML = window.marked && typeof window.marked.parse === 'function' ? window.marked.parse(item.text) : escapeHTML(item.text);
                    }
                    messageContainer.appendChild(div);

                    localStorage.setItem("tenet_chat_history", oldHistory);
                });
                messageContainer.scrollTop = messageContainer.scrollHeight;
            }
            renderSuggestions();
        };
    </script>
</body>
</html>
