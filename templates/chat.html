<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

/* ================= GLOBAL ================= */

body {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ================= NAVBAR ================= */

.sidebar {
    height: 60px;
    width: 100%;
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
    border-bottom: 1px solid rgba(51, 65, 85, 0.3);
    padding: 0 20px;
    z-index: 1000;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.sidebar h4 {
    color: #60a5fa;
    margin: 0 30px 0 0;
    font-weight: 700;
    font-size: 25px;
    letter-spacing: 0.5px;
}

.sidebar a {
    padding: 0 16px;
    color: #cbd5f5 !important;
    text-decoration: none;
    font-size: 14px;
    line-height: 60px;
    transition: all 0.3s ease;
    position: relative;
}

.sidebar a:hover {
    color: #60a5fa !important;
    background-color: rgba(96, 165, 250, 0.1) !important;
}

.sidebar a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 16px;
    right: 16px;
    height: 2px;
    background: linear-gradient(90deg, #3b82f6, #60a5fa);
    transform: scaleX(0);
    transition: transform 0.3s ease;
}

.sidebar a:hover::after {
    transform: scaleX(1);
}

/* ================= CHAT AREA ================= */

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 80px 20% 20px 20%;
    display: flex;
    flex-direction: column;
    gap: 24px;
}

/* ================= MESSAGE BUBBLES ================= */

.msg {
    max-width: 75%;
    padding: 16px 20px;
    font-size: 15px;
    line-height: 1.7;
    word-wrap: break-word;
    border-radius: 16px;
    animation: fadeIn 0.2s ease-out;
}

/* User */

.msg-user {
    align-self: flex-end;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
}

/* AI */

.msg-ai {
    align-self: flex-start;
    background: linear-gradient(
        135deg,
        rgba(15, 23, 42, 0.95),
        rgba(10, 15, 30, 0.95)
    );
    border: 1px solid rgba(96, 165, 250, 0.2);
    color: #cbd5f5;
    border-bottom-left-radius: 4px;
    backdrop-filter: blur(10px);
    box-shadow:
        0 8px 32px rgba(0,0,0,0.25),
        inset 0 1px 1px rgba(96,165,250,0.05);
}

/* AI Markdown Element Adjustments */
.msg-ai p { margin: 0 0 10px 0; }
.msg-ai p:last-child { margin-bottom: 0; }
.msg-ai ul, .msg-ai ol { margin: 6px 0; padding-left: 20px; }
.msg-ai code { background: rgba(255, 255, 255, 0.1); padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 0.95em; color: #93c5fd; }
.msg-ai pre { background: rgba(0, 0, 0, 0.4); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; border: 1px solid rgba(255,255,255,0.05); }
.msg-ai pre code { background: transparent; padding: 0; color: inherit; font-size: 0.9em; }

/* ================= INPUT AREA ================= */

.input-area {
    padding: 20px 20% 40px 20%;
    background: linear-gradient(
        transparent,
        rgba(15, 23, 42, 0.8) 20%,
        rgba(15, 23, 42, 1)
    );
    backdrop-filter: blur(8px);
}

/* ================= SUGGESTIONS ================= */

.suggestions-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
}

.suggestion-btn {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(96, 165, 250, 0.2);
    color: #cbd5f5;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.25s ease;
    backdrop-filter: blur(6px);
}

.suggestion-btn:hover {
    border-color: rgba(96, 165, 250, 0.5);
    background: rgba(59, 130, 246, 0.12);
    color: #60a5fa;
    transform: translateY(-2px);
}

/* ================= INPUT BOX ================= */

.input-wrapper {
    background: linear-gradient(
        135deg,
        rgba(15, 23, 42, 0.95),
        rgba(10, 15, 30, 0.95)
    );
    border: 1px solid rgba(96, 165, 250, 0.25);
    border-radius: 16px;
    display: flex;
    align-items: center;
    padding: 12px 20px;
    backdrop-filter: blur(10px);

    box-shadow:
        0 8px 32px rgba(0,0,0,0.3),
        inset 0 1px 1px rgba(96,165,250,0.08);
}

.input-wrapper:focus-within {
    border-color: #60a5fa;
    box-shadow:
        0 0 0 3px rgba(96, 165, 250, 0.15),
        0 8px 32px rgba(0,0,0,0.3);
}

.input-wrapper input {
    flex: 1;
    background: transparent;
    border: none;
    color: #e2e8f0;
    font-size: 15px;
    outline: none;
}

.input-wrapper input::placeholder {
    color: #64748b;
}

/* ================= SEND BUTTON ================= */

.input-wrapper button {
    margin-left: 15px;
    padding: 10px 24px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    color: white;

    background: linear-gradient(
        135deg,
        #3b82f6,
        #2563eb
    );

    box-shadow:
        0 4px 15px rgba(59,130,246,0.25);

    transition: all 0.25s ease;
}

.input-wrapper button:hover {
    background: linear-gradient(
        135deg,
        #60a5fa,
        #3b82f6
    );

    transform: translateY(-2px);

    box-shadow:
        0 8px 25px rgba(59,130,246,0.4);
}

/* ================= SCROLLBAR ================= */

#messages::-webkit-scrollbar {
    width: 8px;
}

#messages::-webkit-scrollbar-track {
    background: transparent;
}

#messages::-webkit-scrollbar-thumb {
    background: rgba(96, 165, 250, 0.25);
    border-radius: 999px;
}

#messages::-webkit-scrollbar-thumb:hover {
    background: rgba(96, 165, 250, 0.4);
}

/* ================= ANIMATION ================= */

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ================= MOBILE ================= */

@media (max-width: 768px) {

    #messages {
        padding: 80px 5% 20px 5%;
    }

    .input-area {
        padding: 20px 5% 30px 5%;
    }

    .sidebar {
        flex-direction: column;
        height: auto;
        padding: 10px;
    }

    .sidebar a {
        line-height: normal;
        padding: 8px 0;
    }

    .msg {
        max-width: 90%;
    }
}

</style>

</head>
<body>

    <div class="sidebar">
        <h4>TENET</h4>
        <a href="/dashboard">Dashboard</a>
        <a href="/info">Info</a>
        <a href="/alerts">Alerts & Logging</a>
        <a href="/agents">Live Agents</a>
        <a href="/tasks">Tasks</a>
        <a href="/uploads">Uploaded Files</a>
        <a href="/plugins">Plugins</a>
        <a href="/chat">AI Assistant</a>
        <a href="{{ url_for('auth.logout') }}">Logout</a>
    </div>

    <div id="messages"></div>

    <div class="input-area">
        <div id="suggestions" class="suggestions-row"></div>
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const messageContainer = document.getElementById("messages");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const suggestionBox = document.getElementById("suggestions");

        const CONFIG = {
            endpoint: "/ai/chat",
            suggestions: ["Which agents are offline?", "Show recent alerts", "Show Pending Tasks?"]
        };

        function escapeHTML(str) {
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[m]);
        }

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = `msg ${type === "user" ? "msg-user" : "msg-ai"}`;

            // Check if the response is from AI and the parser is ready
            if (type === "ai") {
                if (window.marked && typeof window.marked.parse === "function") {
                    div.innerHTML = window.marked.parse(text);
                } else {
                    div.innerHTML = escapeHTML(text);
                }
            } else {
                // Ensure user-supplied data remains clean plain text
                div.innerHTML = escapeHTML(text);
            }

            messageContainer.appendChild(div);
            messageContainer.scrollTop = messageContainer.scrollHeight;

            // SYNC LOGIC (Saves the raw string format into your logs):
            const history = JSON.parse(localStorage.getItem("tenet_chat_history") || "[]");
            history.push({ text, type });
            localStorage.setItem("tenet_chat_history", JSON.stringify(history));
        }

        function renderSuggestions() {
            CONFIG.suggestions.forEach(q => {
                const btn = document.createElement("button");
                btn.className = "suggestion-btn";
                btn.textContent = q;
                btn.onclick = () => send(q);
                suggestionBox.appendChild(btn);
            });
        }

        async function send(msg = null) {
            const text = msg || userInput.value.trim();
            if (!text) return;

            addMessage(text, "user");
            userInput.value = "";

            const loading = document.createElement("div");
            loading.className = "msg msg-ai";
            loading.textContent = "...";
            messageContainer.appendChild(loading);

            try {
                const res = await fetch(CONFIG.endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                loading.remove();
                addMessage(data.reply || "No response.", "ai");
            } catch (e) {
                loading.remove();
                addMessage("Server error.", "ai");
            }
        }

        sendBtn.onclick = () => send();
        userInput.onkeypress = (e) => { if (e.key === "Enter") send(); };

        window.onload = () => {
            addMessage("How can I help you today?", "ai");
            renderSuggestions();
        };
    </script>
</body>
</html>
