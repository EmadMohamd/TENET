<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Uploaded Files</title>
<link rel="icon" type="image/png" href="/static/images/icon.png">
<link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='css/uploads.css') }}" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
    <h4>TENET</h4>
    <a href="/dashboard">Dashboard</a>
    <a href="/info">Info</a>
    <a href="/alerts">Alerts & Logging</a>
    <a href="/agents">Live Agents</a>
    <a href="/tasks">Tasks</a>
    <a href="/uploads">Uploaded Files</a>
    <a href="/plugins">Plugins</a>
    <a href="/chat">AI Assistant</a>
    <a href="{{ url_for('auth.logout') }}">Logout</a>
</div>

<!-- ================= MAIN ================= -->
<div class="main">
<div class="card mb-4">
<div class="card-body">

<div class="section-title mb-3">Uploaded Files</div>

<table class="table table-hover table-bordered" id="filesTable">
<thead class="table-dark">
<tr>
    <th>Filename</th>
    <th>Actions</th>
</tr>
</thead>
<tbody id="filesBody"></tbody>
</table>

<p id="noFilesMessage" style="display:none;">No uploaded files found.</p>

</div>
</div>
</div>

<!-- ===== Preview Modal (same style as plugins) ===== -->
<div class="modal fade" id="filePreviewModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content upload-modal">

      <div class="modal-header">
        <h5 class="modal-title" id="filePreviewTitle">File Preview</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" id="filePreviewBody">
        <!-- dynamic -->
      </div>

    </div>
  </div>
</div>

<script>
    window.API_KEY = "{{ api_key }}";
</script>

<script src="{{ url_for('static', filename='js/uploads.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
