<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Uploaded Files</title>
    <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
    <h4>C2 Panel</h4>
    <a href="{{ url_for('dashboard') }}" class="{% if request.path == url_for('dashboard') %}disabled-link{% endif %}">Dashboard</a>
    <a href="{{ url_for('agents_list') }}" class="{% if request.path == url_for('agents_list') %}disabled-link{% endif %}">Live Agents</a>
    <a href="{{ url_for('tasks_list') }}" class="{% if request.path == url_for('tasks_list') %}disabled-link{% endif %}">All Tasks</a>
    <a href="{{ url_for('uploads_list') }}" class="{% if request.path == url_for('uploads_list') %}disabled-link{% endif %}">Uploaded Files</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</div>

<!-- ================= MAIN ================= -->
<div class="main">
    <div class="card mb-4">
        <div class="card-body">
            <div class="section-title mb-3">Uploaded Files</div>
            <table class="table table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Filename</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="filesBody">
                    <!-- Filled dynamically -->
                </tbody>
            </table>

            <p id="noFilesMessage" style="display:none;">No uploaded files found.</p>
        </div>
    </div>
</div>

</body>

<script>
    window.API_KEY = "{{ api_key }}";
</script>
<script src="{{ url_for('static', filename='js/uploads.js') }}"></script>
</body>
</html>
</html>
