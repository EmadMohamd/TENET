<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Agents</title>
<link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    /* Table customizations */
    table tbody tr {
        background-color: #334155;
        color: #e5e7eb;
    }
    table thead {
        background-color: #020617;
        color: #e5e7eb;
    }
    a.text-primary {
        color: #60a5fa !important; /* blue for agent id */
        text-decoration: none;
    }
    a.text-primary:hover {
        text-decoration: underline;
    }
    .badge-online {
        background-color: #22c55e;
    }
    .badge-offline {
        background-color: #ef4444;
    }
</style>
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
    <h4>C2 Panel</h4>
    <a href="{{ url_for('dashboard') }}" class="{% if request.path == url_for('dashboard') %}disabled-link{% endif %}">Dashboard</a>
    <a href="{{ url_for('agents_list') }}" class="{% if request.path == url_for('agents_list') %}disabled-link{% endif %}">Live Agents</a>
    <a href="{{ url_for('tasks_list') }}" class="{% if request.path == url_for('tasks_list') %}disabled-link{% endif %}">All Tasks</a>
    <a href="{{ url_for('uploads_list') }}" class="{% if request.path == url_for('uploads_list') %}disabled-link{% endif %}">Uploaded Files</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</div>

<!-- ================= MAIN ================= -->
<div class="main">
    <div class="card mb-4">
        <div class="card-body">
            <div class="section-title mb-3">Live Agents</div>

            <table class="table table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Agent ID</th>
                        <th>Status</th>
                        <th>Last Seen</th>
                        <th>Pending Tasks</th>
                    </tr>
                </thead>
                <tbody>
                    {% for agent in agents %}
                    <tr>
                        <td>
                            <a href="/agents/{{ agent.id }}" class="text-primary">{{ agent.id }}</a>
                        </td>
                        <td>
                            {% if agent.status == 'online' %}
                                <span class="badge badge-online">Online</span>
                            {% else %}
                                <span class="badge badge-offline">Offline</span>
                            {% endif %}
                        </td>
                        <td>{{ agent.last_seen }}</td>
                        <td>{{ agent.pending_tasks }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

        </div>
    </div>
</div>

</body>
</html>
