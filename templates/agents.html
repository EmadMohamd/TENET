<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Agents</title>
<link rel="icon" type="image/png" href="/static/images/icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
<style>
    /* Table customizations */
    table tbody tr {
        background-color: #334155;
        color: #e5e7eb;
    }
    table thead {
        background-color: #020617;
        color: #e5e7eb;
    }
    a.text-primary {
        color: #60a5fa !important; /* blue for agent id */
        text-decoration: none;
    }
    a.text-primary:hover {
        text-decoration: underline;
    }
    .badge-online {
        background-color: #22c55e;
    }
    .badge-offline {
        background-color: #ef4444;
    }
</style>
</head>
<body>


<!-- ================= NavBar ================= -->
    <div class="sidebar">
        <h4>TENET</h4>
        <a href="/dashboard">Dashboard</a>
        <a href="/info">Info</a>
        <a href="/alerts">Alerts & Logging</a>
        <a href="/agents">Live Agents</a>
        <a href="/tasks">Tasks</a>
        <a href="/uploads">Uploaded Files</a>
        <a href="/plugins">Plugins</a>
        <a href="/chat">AI Assistant</a>
        <a href="{{ url_for('auth.logout') }}">Logout</a>
    </div>

<!-- ================= MAIN ================= -->
<div class="main">
    <!-- ===== AGENT FILTERS HORIZONTAL ===== -->
    <div class="filters-wrapper d-flex gap-2 align-items-center">
        <input type="text" class="form-control filter-input" id="filterAgentID" placeholder="Agent ID">
        <input type="text" class="form-control filter-input" id="filterUser" placeholder="User">
        <select class="form-select filter-input" id="filterOS">
            <option value="">OS</option>
            <option value="windows">Windows</option>
            <option value="linux">Linux</option>
            <option value="mac">Mac</option>
        </select>
        <select class="form-select filter-input" id="filterAgentStatus">
            <option value="">Status</option>
            <option value="online">Online</option>
            <option value="offline">Offline</option>
        </select>
    </div>
    <div class="card mb-4">
        <div class="card-body">
            <div class="section-title mb-3">Live Agents</div>

            <table class="table table-hover table-bordered" id="agentsTable">
                <thead class="table-dark">
                    <tr>
                        <th>Status</th>
                        <th>ID</th>
                        <th>Hostname</th>
                        <th>User</th>
                        <th>OS</th>
                        <th>IP</th>
                        <th>Last Seen</th>
                        <th>Pending Tasks</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated dynamically by JS -->
                    <tr>
                        <td colspan="8" class="text-center text-muted">Loading agents...</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>

<!-- ================= JS ================= -->
<script src="{{ url_for('static', filename='js/agents.js') }}"></script>

</body>
</html>
