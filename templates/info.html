<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>C2 Control Panel</title>
<link href="{{ url_for('static', filename='css/info.css') }}" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
    <h4>C2 Panel</h4>
    <a href="/dashboard">Dashboard</a>
    <a href="/info">Info</a>
    <a href="/agents">Live Agents</a>
    <a href="/tasks">Tasks</a>
    <a href="/uploads">Uploaded Files</a>
    <a href="/plugins">Plugins</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</div>

<!-- ================= MAIN ================= -->
<div class="main">
    <div class="dashboard-grid">
        <!-- MAP -->
        <div class="grid-item">
            <div class="card">
                <div class="card-body">
                    <div class="section-title mb-3">Agents IP Geographical Map</div>
                    <div class="map" id="map-container">{{ map|safe }}</div>
                </div>
            </div>
        </div>

        <!-- BAR CHART -->
        <div class="grid-item">
            <div class="card">
                <div class="card-body">
                    <div class="section-title mb-3">Tasks by Agents Over Time</div>
                    <div class="barchart" id="barchart">{{ chart|safe }}</div>
                </div>
            </div>
        </div>

        <!-- PIE CHART Agents -->
        <div class="grid-item">
            <div class="card">
                <div class="card-body">
                    <div class="section-title mb-3">Online Vs Offline Agents</div>
                    <div class="piechart" id="piechart">{{ pie|safe }}</div>
                </div>
            </div>
        </div>

        <!-- PIE CHART Tasks -->
        <div class="grid-item">
            <div class="card">
                <div class="card-body">
                    <div class="section-title mb-3">Agents Tasks</div>
                    <select id="agentDropdown"></select>
                    <div class="piechart" id="piechart_tasks"></div>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script src="{{ url_for('static', filename='js/info.js') }}"></script>
