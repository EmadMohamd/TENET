<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>C2 Control Panel</title>
<link href="{{ url_for('static', filename='css/info.css') }}" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
    <h4>C2 Panel</h4>
    <a href="/dashboard">Dashboard</a>
    <a href="/info">Info</a>
    <a href="/agents">Live Agents</a>
    <a href="/tasks">Tasks</a>
    <a href="/uploads">Uploaded Files</a>
    <a href="/plugins">Plugins</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</div>

<!-- ================= MAIN ================= -->
<div class="main">
    <div class="row g-3">

        <!-- MAP -->
        <div class="col-md-6">
            <div id="live-agents-map" class="card mb-4">
                <div class="card-body">
                    <div class="section-title mb-3">Agents Map</div>
                    <div class="map">
                        {{ map|safe }}
                    </div>
                </div>
            </div>
        </div>

        <!-- PIE CHART -->
        <div class="col-md-6">
            <div id="agents-analytics" class="card mb-4">
                <div class="card-body">
                    <div class="section-title mb-3">Agents Data</div>
                    <div class="piechart">
                        {{ chart_html|safe }}
                    </div>
                </div>
            </div>
        </div>

        <!-- Example additional content row (optional) -->
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-body">
                    <div class="section-title mb-3">Another Panel</div>
                    <p>Additional content can go here.</p>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-body">
                    <div class="section-title mb-3">Fourth Panel</div>
                    <p>More content here.</p>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    window.API_KEY = "{{ api_key }}";
</script>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
