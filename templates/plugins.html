<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plugins</title>

<link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='css/plugins.css') }}" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
    <h4>TENET</h4>
    <a href="/dashboard">Dashboard</a>
    <a href="/info">Info</a>
    <a href="/alerts">Alerts & Logging</a>
    <a href="/agents">Live Agents</a>
    <a href="/tasks">Tasks</a>
    <a href="/uploads">Uploaded Files</a>
    <a href="/plugins">Plugins</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</div>

<!-- ================= MAIN ================= -->
<div class="main">
<div class="card mb-4">
<div class="card-body">

<div class="section-title mb-3">Available Plugins</div>

<form method="post" action="/plugins/run">
<div class="row mb-3">
    <div class="col-md-3">
        <input class="form-control" type="text" name="agent_id" placeholder="Agent ID" required>
    </div>
</div>

<table class="table table-hover">
<thead>
<tr>
<th>Plugin Name</th>
<th>Action</th>
</tr>
</thead>
<tbody>
{% for plugin in plugins %}
<tr>
    <td>
        <a href="#" onclick="previewPlugin('{{ plugin }}'); return false;" class="plugin-link">
            {{ plugin }}
        </a>
    </td>
    <td>
        <button type="submit" name="plugin_name" value="{{ plugin }}" class="btn btn-primary btn-sm">
            Run
        </button>
    </td>
</tr>
{% endfor %}
</tbody>
</table>
</form>

</div>
</div>
</div>

<!-- ===== Modal ===== -->
<div class="modal fade" id="pluginPreviewModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content plugin-modal">

      <div class="modal-header">
        <h5 class="modal-title" id="pluginPreviewTitle">Plugin Preview</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <pre id="pluginPreviewContent"></pre>
      </div>

    </div>
  </div>
</div>

<script>
    window.API_KEY = "{{ api_key }}";
</script>

<script src="{{ url_for('static', filename='js/plugins.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
