<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plugins - C2 Control Panel</title>
<link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
    <h4>C2 Panel</h4>
    <a href="/agents">Live Agents</a>
    <a href="/tasks">Tasks</a>
    <a href="/uploads">Files</a>
    <a href="/plugins">Plugins</a> <!-- Added plugins link -->
    <a href="{{ url_for('logout') }}">Logout</a>
</div>

<!-- ================= MAIN ================= -->
<div class="main">

<div class="card mb-4">
<div class="card-body">
<div class="section-title mb-3">Available Plugins</div>

<form method="post" action="/plugins/run">
<div class="row mb-3">
    <div class="col-md-3">
        <input class="form-control" type="text" name="agent_id" placeholder="Agent ID" required>
    </div>
</div>

<table class="table table-hover">
<thead>
<tr>
<th>Plugin Name</th>
<th>Action</th>
</tr>
</thead>
<tbody>
{% for plugin in plugins %}
<tr>
    <td>{{ plugin }}</td>
    <td>
        <button type="submit" name="plugin_name" value="{{ plugin }}" class="btn btn-primary btn-sm">Run</button>
    </td>
</tr>
{% endfor %}
</tbody>
</table>
</form>

</div>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
