<div id="ai-chat-root"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
(function () {
    if (window.ChatWidget) return; // prevent double load

    window.ChatWidget = {
        init(config = {}) {
            const root = document.getElementById(config.rootId || "ai-chat-root");
            if (!root) return;

            // Inject UI
            root.innerHTML = `
                <button class="cw-btn"><img src="/static/images/logo.png" alt="AI" /></button>
                <div class="cw-box">
                    <div class="cw-messages"></div>
                    <div class="cw-suggestions"></div>
                    <div class="cw-input">
                        <input type="text" placeholder="Type..." />
                        <button>Send</button>
                    </div>
                </div>
            `;

            // Styles (scoped) - KEPT EXACTLY THE SAME WITH A FEW ADDITIONS FOR MARKDOWN LISTS
            const style = document.createElement("style");
            style.innerHTML = `
                 .cw-btn {
                    position: fixed;
                    bottom: 20px;
                    right: 20px;
                    width: 60px;
                    height: 60px;
                    border-radius: 50%;
                    background: #1e293b;
                    border: none;
                    padding: 0;
                    cursor: pointer;
                    z-index: 9999;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    overflow: hidden;
                }

                .cw-btn img {
                    width: 100%;
                    height: 100%;
                    border-radius: 50%;
                    object-fit: cover;
                    display: block;
                }

                .cw-box {
                    display: none;
                    position: fixed;
                    bottom: 90px;
                    right: 20px;
                    width: 320px;
                    height: 350px;
                    max-height: 450px;
                    background: #1e293b;
                    color: #e5e7eb;
                    border-radius: 12px;
                    flex-direction: column;
                    z-index: 9999;
                    overflow: hidden;
                }

                .cw-messages {
                    flex: 1;
                    overflow-y: auto;
                    padding: 10px;
                    display: flex;
                    flex-direction: column;
                    gap: 6px;
                }

                .cw-input {
                    display: flex;
                    padding: 8px;
                    border-top: 1px solid #334155;
                }

                .cw-input input {
                    flex: 1;
                    background: #334155;
                    border: none;
                    color: white;
                    padding: 6px;
                }

                .cw-input button {
                    margin-left: 6px;
                    background: #3b82f6;
                    border: none;
                    color: white;
                    padding: 6px 10px;
                }

                .cw-msg-user {
                    align-self: flex-end;
                    background: #3b82f6;
                    padding: 6px 10px;
                    border-radius: 10px;
                }

                .cw-msg-ai {
                    align-self: flex-start;
                    background: #334155;
                    padding: 6px 10px;
                    border-radius: 10px;
                    max-width: 85%; /* Prevents text from hitting the edge */
                }

                /* Ensures parsed lists and headers inside AI responses look neat */
                .cw-msg-ai p { margin: 0 0 8px 0; }
                .cw-msg-ai p:last-child { margin-bottom: 0; }
                .cw-msg-ai ul, .cw-msg-ai ol { margin: 4px 0; padding-left: 20px; }
                .cw-msg-ai li { margin-bottom: 4px; font-size: 13px; }
                .cw-msg-ai hr { border: 0; border-top: 1px solid #475569; margin: 8px 0; }

                .cw-suggestions {
                    padding: 10px;
                    display: flex;
                    flex-wrap: wrap;
                    gap: 6px;
                    border-top: 1px solid rgba(51, 65, 85, 0.5);
                }

                .cw-suggestions button {
                    font-size: 11px;
                    font-family: inherit;
                    background: rgba(59, 130, 246, 0.1);
                    border: 1px solid #3b82f6;
                    color: #3b82f6;
                    padding: 5px 12px;
                    border-radius: 20px;
                    cursor: pointer;
                    transition: all 0.2s ease;
                    white-space: nowrap;
                }

                .cw-suggestions button:hover {
                    background: #3b82f6;
                    color: #ffffff;
                }
            `;
            document.head.appendChild(style);

            // Elements
            const btn = root.querySelector(".cw-btn");
            const box = root.querySelector(".cw-box");
            const messages = root.querySelector(".cw-messages");
            const input = root.querySelector("input");
            const sendBtn = root.querySelector(".cw-input button");
            const suggestions = root.querySelector(".cw-suggestions");

            const SUGGESTIONS = [
                "Which agents are offline?",
                "What is the execution Success rate for each agent?",
                "Show recent alerts",
                "Show Pending Tasks?"
            ];

            function escapeHTML(str) {
                return str.replace(/[&<>"']/g, m => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                })[m]);
            }

            // MODIFIED: Properly renders markdown for the AI, escapes HTML for the user
            function addMessage(text, type) {
                const div = document.createElement("div");
                div.className = type === "user" ? "cw-msg-user" : "cw-msg-ai";

                if (type === "user" || text === "Thinking...") {
                    div.innerHTML = escapeHTML(text);
                } else {
                    // Check if 'marked' library is loaded, fallback to text if not
                    if (window.marked && typeof window.marked.parse === 'function') {
                        div.innerHTML = window.marked.parse(text);
                    } else {
                        div.innerHTML = escapeHTML(text);
                    }
                }

                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
            }

            function showSuggestions() {
                suggestions.innerHTML = "";
                SUGGESTIONS.sort(() => 0.5 - Math.random())
                    .slice(0, 4)
                    .forEach(q => {
                        const b = document.createElement("button");
                        b.textContent = q;
                        b.onclick = () => send(q);
                        suggestions.appendChild(b);
                    });
            }

            async function send(msg = null) {
                const text = msg || input.value;
                if (!text) return;

                addMessage(text, "user");
                input.value = "";

                addMessage("Thinking...", "ai");

                try {
                    const res = await fetch(config.endpoint || "/ai/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text })
                    });

                    const data = await res.json();

                    messages.lastChild.remove(); // remove "Thinking..."
                    addMessage(data.reply || "No response", "ai");

                } catch (e) {
                    messages.lastChild.remove();
                    addMessage("Error contacting AI", "ai");
                }
            }

            btn.onclick = () => {
                const visible = box.style.display === "flex";
                box.style.display = visible ? "none" : "flex";
                if (!visible) showSuggestions();
            };

            sendBtn.onclick = () => send();
            input.addEventListener("keypress", e => {
                if (e.key === "Enter") send();
            });
        }
    };

    // Auto-init after DOM ready
    document.addEventListener("DOMContentLoaded", () => {
        window.ChatWidget.init();
    });

})();
</script>
