<div id="ai-chat-root"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
(function () {
    if (window.ChatWidget) return; // prevent double load

    window.ChatWidget = {
        init(config = {}) {
            const root = document.getElementById(config.rootId || "ai-chat-root");
            if (!root) return;

            // Inject UI (Header wrapped in an anchor tag linking to /chat)
            root.innerHTML = `
                <button class="cw-btn"><img src="/static/images/icon.png" alt="AI" /></button>
                <div class="cw-box">
                    <a href="/chat" class="cw-header">
                        <div class="cw-header-status"></div>
                        <div class="cw-header-text">
                            <div class="cw-header-title">TENET Assistant</div>
                            <div class="cw-header-subtitle">AI Agent • Online</div>
                        </div>
                    </a>
                    <div class="cw-messages"></div>
                    <div class="cw-suggestions"></div>
                    <div class="cw-input">
                        <input type="text" placeholder="Type..." />
                        <button>Send</button>
                    </div>
                </div>
            `;

            // Styles (scoped)
            const style = document.createElement("style");
            style.innerHTML = `
/* ================= FLOAT BUTTON ================= */
.cw-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 1px solid rgba(96, 165, 250, 0.25);
    cursor: pointer;
    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    box-shadow:
        0 8px 25px rgba(0,0,0,0.4),
        0 0 0 1px rgba(59,130,246,0.15);
}

.cw-btn:hover {
    transform: translateY(-2px);
    box-shadow:
        0 12px 30px rgba(0,0,0,0.5),
        0 0 0 1px rgba(59,130,246,0.3);
}

.cw-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
    transform: scale(1.24);
}

/* ================= CHAT BOX ================= */
.cw-box {
    display: none;
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 340px;
    height: 460px;

    background: linear-gradient(
        135deg,
        rgba(15, 23, 42, 0.95),
        rgba(10, 15, 30, 0.95)
    );

    color: #e5e7eb;
    border-radius: 16px;
    border: 1px solid rgba(96, 165, 250, 0.25);
    flex-direction: column;
    z-index: 9999;
    overflow: hidden;

    box-shadow:
        0 12px 40px rgba(0,0,0,0.5),
        inset 0 1px 1px rgba(96,165,250,0.08);

    backdrop-filter: blur(12px);
}

/* ================= HEADER INDICATOR ================= */
.cw-header {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    background: rgba(30, 41, 59, 0.5);
    border-bottom: 1px solid rgba(96, 165, 250, 0.15);
    text-decoration: none !important; /* Prevents anchor underline styling */
    transition: background 0.2s ease;
}

.cw-header:hover {
    background: rgba(59, 130, 246, 0.1); /* Subtle hover feedback linking to main page */
}

.cw-header-status {
    width: 8px;
    height: 8px;
    background-color: #22c55e;
    border-radius: 50%;
    margin-right: 12px;
    box-shadow: 0 0 10px #22c55e;
}

.cw-header-text {
    display: flex;
    flex-direction: column;
}

.cw-header-title {
    font-size: 14px;
    font-weight: 600;
    color: #f8fafc;
}

.cw-header-subtitle {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 1px;
}

/* ================= MESSAGES ================= */
.cw-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* USER MESSAGE */
.cw-msg-user {
    align-self: flex-end;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    padding: 10px 14px;
    border-radius: 14px;
    max-width: 80%;
    box-shadow: 0 8px 20px rgba(59,130,246,0.25);
}

/* AI MESSAGE */
.cw-msg-ai {
    align-self: flex-start;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid rgba(96, 165, 250, 0.2);
    color: #cbd5f5;
    padding: 10px 14px;
    border-radius: 14px;
    max-width: 80%;

    box-shadow:
        0 8px 20px rgba(0,0,0,0.3),
        inset 0 1px 1px rgba(96,165,250,0.05);
}

.cw-msg-ai p { margin: 0 0 8px 0; }
.cw-msg-ai p:last-child { margin-bottom: 0; }
.cw-msg-ai ul, .cw-msg-ai ol { margin: 4px 0; padding-left: 20px; }
.cw-msg-ai code { background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; font-family: monospace; }
.cw-msg-ai pre { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; overflow-x: auto; }
.cw-msg-ai pre code { background: transparent; padding: 0; }

/* ================= SUGGESTIONS ================= */
.cw-suggestions {
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    border-top: 1px solid rgba(96, 165, 250, 0.15);
}

.cw-suggestions button {
    font-size: 11px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(96, 165, 250, 0.3);
    color: #cbd5f5;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.cw-suggestions button:hover {
    background: rgba(59, 130, 246, 0.15);
    border-color: rgba(96, 165, 250, 0.6);
    color: #60a5fa;
    transform: translateY(-1px);
}

/* ================= INPUT ================= */
.cw-input {
    display: flex;
    padding: 10px;
    border-top: 1px solid rgba(96, 165, 250, 0.15);
    background: rgba(10, 15, 30, 0.6);
}

.cw-input input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #e5e7eb;
    padding: 8px;
}

.cw-input input::placeholder {
    color: #64748b;
}

.cw-input button {
    margin-left: 8px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s ease;
}

.cw-input button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(59,130,246,0.3);
}
`;
            document.head.appendChild(style);

            // Elements
            const btn = root.querySelector(".cw-btn");
            const box = root.querySelector(".cw-box");
            const messages = root.querySelector(".cw-messages");
            const input = root.querySelector("input");
            const sendBtn = root.querySelector(".cw-input button");
            const suggestions = root.querySelector(".cw-suggestions");

            const SUGGESTIONS = [
                "Which agents are offline?",
                "What is the execution Success rate for each agent?",
                "Show recent alerts",
                "Show Pending Tasks?"
            ];

            function escapeHTML(str) {
                return str.replace(/[&<>"']/g, m => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                })[m]);
            }

            function addMessage(text, type) {
                const div = document.createElement("div");
                div.className = type === "user" ? "cw-msg-user" : "cw-msg-ai";

                if (type === "ai") {
                    if (window.marked && typeof window.marked.parse === "function") {
                        div.innerHTML = window.marked.parse(text);
                    } else {
                        div.innerHTML = escapeHTML(text);
                    }
                } else {
                    div.innerHTML = escapeHTML(text);
                }

                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
            }

            function showSuggestions() {
                suggestions.innerHTML = "";
                SUGGESTIONS.sort(() => 0.5 - Math.random())
                    .slice(0, 4)
                    .forEach(q => {
                        const b = document.createElement("button");
                        b.textContent = q;
                        b.onclick = () => send(q);
                        suggestions.appendChild(b);
                    });
            }

            async function send(msg = null) {
                const text = msg || input.value;
                if (!text) return;

                addMessage(text, "user");
                input.value = "";

                addMessage("Thinking...", "ai");

                try {
                    const res = await fetch(config.endpoint || "/ai/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text })
                    });

                    const data = await res.json();

                    messages.lastChild.remove(); // remove "Thinking..."
                    addMessage(data.reply || "No response", "ai");

                } catch (e) {
                    messages.lastChild.remove();
                    addMessage("Error contacting AI", "ai");
                }
            }

            btn.onclick = () => {
                const visible = box.style.display === "flex";
                box.style.display = visible ? "none" : "flex";
                if (!visible) showSuggestions();
            };

            sendBtn.onclick = () => send();
            input.addEventListener("keypress", e => {
                if (e.key === "Enter") send();
            });
        }
    };

    // Auto-init after DOM ready
    document.addEventListener("DOMContentLoaded", () => {
        window.ChatWidget.init();
    });

})();
</script>
