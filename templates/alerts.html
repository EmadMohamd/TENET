<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Tasks</title>
    <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/alert.css') }}" rel="stylesheet">
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
    <h4>TENET</h4>
    <a href="/dashboard">Dashboard</a>
    <a href="/info">Info</a>
    <a href="/alerts">Alerts & Logging</a>
    <a href="/agents">Live Agents</a>
    <a href="/tasks">Tasks</a>
    <a href="/uploads">Uploaded Files</a>
    <a href="/plugins">Plugins</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</div>

<!-- ================= MAIN ================= -->
<div class="main">
    <div class="card mb-4">
        <div class="card-body">
            <div class="section-title mb-3">Logs & Alerts</div>


            <!-- ===== Tasks Table ===== -->
            <table class="table table-hover table-bordered" id="alertsTable">
                <thead class="table-dark">
                    <tr>
                        <th>Log ID</th>
                        <th>Log message</th>
                        <th>Timestamp</th>
                        <th>Role</th>
                        <th>Alert level</th>
                        <th>Task ID</th>
                    </tr>
                </thead>
                <tbody id="alertsBody">
                    <!-- Populated via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    window.API_KEY = "{{ api_key }}";
</script>
<script src="{{ url_for('static', filename='js/alerts.js') }}"></script>
</body>
</html>
